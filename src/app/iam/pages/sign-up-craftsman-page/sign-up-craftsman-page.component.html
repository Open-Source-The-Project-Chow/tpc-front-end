<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Sign Up</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="auth-input-group">
        <label for="username">Email</label>
        <input
          id="username"
          type="text"
          placeholder="Enter your email"
          formControlName="username"
          class="auth-input"
        />
        <span *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="auth-error">
          Please enter a valid username.
        </span>
      </div>

      <div class="auth-input-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          formControlName="password"
          class="auth-input"
        />
        <span *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="auth-error">
          Password must be at least 6 characters.
        </span>
      </div>
      <div class="auth-input-group">
        <label for="firstName">First Name</label>
        <input
          id="firstName"
          type="text"
          placeholder="Enter your firstName"
          formControlName="firstName"
          class="auth-input"
        />
        <span *ngIf="form.get('firstName')?.invalid && form.get('firstName')?.touched" class="auth-error">
          Password must be at least 6 characters.
        </span>
      </div>

      <div class="auth-input-group">
        <label for="lastName">Last Name</label>
        <input
          id="lastName"
          type="text"
          placeholder="Enter your lastName"
          formControlName="lastName"
          class="auth-input"
        />
        <span *ngIf="form.get('lastName')?.invalid && form.get('lastName')?.touched" class="auth-error">
          Password must be at least 6 characters.
        </span>
      </div>

      <div class="auth-input-group">
        <label for="phoneNumber">Phone</label>
        <input
          id="phoneNumber"
          type="text"
          placeholder="Enter your phoneNumber"
          formControlName="phoneNumber"
          class="auth-input"
        />
        <span *ngIf="form.get('phoneNumber')?.invalid && form.get('phoneNumber')?.touched" class="auth-error">
          Password must be at least 6 characters.
        </span>
      </div>

      <button type="submit" class="auth-button">Sign Up</button>
      <a class="auth-link" routerLink="/sign-in">Already have an account? Sign In</a>
    </form>
  </div>
</div>
